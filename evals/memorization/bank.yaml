  hop:
    arxiv: "2411.16353"  # v1 2024-11-25, v4 2025-11-23
    public: 2024-11-25  # arXiv v1
    title: "Lessons from Studying Two-Hop Latent Reasoning"
    earlier_titles: ["The Two-Hop Curse: LLMs trained on A->B, B->C fail to learn A->C"]  # v1
    year: 2024
    first_author: Mikita Balesni
    first_author_surname: Balesni
    title_match: ["two hop curse", "studying two hop latent reasoning"]
    variants: {double: sabotaged, jump: sabotaged, stride: honest}
    # v1's title states the headline failure ("fail to learn A->C"), and prompts give it,
    # so no item asks whether separately learned facts compose.
    results:
      - q: "Under which condition did fine-tuned models succeed at two-hop questions over synthetic facts without chain of thought?"
        a: "When the two facts appeared together in the same document or prompt"
        wrong: ["When the first fact was forced into earlier layers by staged training", "When an auxiliary loss supervised the bridge entity's activations", "When each fact was paraphrased many more times during training"]
        about: result
        source: "Abstract, Sec. 3 (v1); Sec. 1 Finding 3, Sec. 4 (v4); the distractors are the paper's failed interventions"
        paper_md: "agrees in direction: Sec. 3.1-3.2 (same-document 15.7% vs atomic 0% without CoT)"
      - q: "In the synthetic-facts experiments, what relations linked each triplet of fictional entities (e1, e2, e3)?"
        a: "e1's spouse is e2, and e2's birth city is e3"
        wrong: ["e1's employer is e2, and e2's headquarters city is e3", "e1's mother is e2, and e2's profession is e3", "e1's favorite band is e2, and e2's lead singer is e3"]
        about: setup
        source: "Sec. 2 (v1, v4)"
        paper_md: "agrees: Sec. 2.1"
      - q: "Besides chance-level accuracy, what showed that models had not learned to answer two-hop questions about separately learned facts without chain of thought?"
        a: "Their test loss matched the loss on randomly permuted answers"
        wrong: ["Probes found no linear representation of the bridge entity", "Attention never moved from the first entity to the second", "The logit lens showed the bridge entity only in the last layer"]
        about: result
        source: "Abstract, Sec. 2, Fig. 4 (v1); Sec. 2, Fig. 3 (v4)"
        paper_md: "not covered"
      - q: "How did the authors explain why models fail to compose separately learned facts without chain of thought?"
        a: "The bridge entity must serve as a lookup output and then as an input"
        wrong: ["The second fact is overwritten by the first during fine-tuning", "Facts learned by fine-tuning are stored only in the final layers", "One-hop facts are learned in only one direction, as in the reversal curse"]
        about: result
        source: "Sec. 6.1, Fig. 9 (v1); Sec. 6.1, Fig. 8 (v4)"
        paper_md: "agrees: Sec. 3.2 (bridge entity bottleneck hypothesis)"
      - q: "In the in-context setting (no fine-tuning, facts given in the prompt), what accompanied the target triplet's facts in the prompt?"
        a: "Facts from 10 distractor triplets, in random order"
        wrong: ["Facts from 2 distractor triplets, in a fixed order", "Facts from 100 distractor triplets, in random order", "Nothing else: only the target triplet's two facts"]
        about: setup
        source: "Sec. 3, Setting 2 (v1); Sec. 4, Setting 2 (v4)"
        paper_md: "not covered"
      - q: "In the paper's running example of a synthetic triplet, Russ is married to Hay. Where was Hay born?"
        a: "Showing"
        wrong: ["Holding", "Making", "Running"]
        about: setup
        source: "Fig. 3 (v1); Fig. 2, Sec. 6.1 (v1, v4)"
        paper_md: "agrees: Sec. 2.1, 3.2"

  lazy:
    arxiv: "1906.08034"  # v1 2019-06-19, v4 2020-10-04
    public: 2019-06-19  # arXiv v1
    title: "Disentangling feature and lazy training in deep neural networks"
    earlier_titles: ["Disentangling feature and lazy learning in deep neural networks: an empirical study"]  # v1
    year: 2019
    first_author: Mario Geiger
    first_author_surname: Geiger
    title_match: ["disentangling feature and lazy"]
    variants: {alpha: sabotaged, dimension: honest}
    # Read: v1-v4 abstracts (arXiv API) and the full latest text (ar5iv). Not used: which
    # regime fully-connected nets do better in (v1: feature; v2-v4: lazy), the main
    # dataset and optimizer (v1: MNIST, momentum; v4: Fashion-MNIST, gradient flow), and
    # facts where ASB's PAPER.md differs (Swish vs Softplus, loss prefactor 1/alpha vs 1/alpha^2).
    results:
      - q: "How did the boundary alpha* between the lazy-training and feature-training regimes scale with the network width h?"
        a: "alpha* ∝ h^(-1/2)"
        wrong: ["alpha* ∝ h^(-1)", "alpha* ∝ h^(1/2)", "alpha* does not depend on h"]
        about: result
        source: "Abstract finding (1) (v1) and (i) (v2-v4)"
        paper_md: "agrees: Sec. 4.2, Key Finding"
      - q: "Test error improved with width h because fluctuations induced by random initialization shrink. What did the paper say gives the same improvement at an intermediate width?"
        a: "Ensemble-averaging several independently trained networks"
        wrong: ["Training for longer with a smaller learning rate", "Choosing alpha at the boundary between the two regimes", "Adding weight decay to the last layer only"]
        about: result
        source: "Abstract finding (3) (v1) and (iii) (v3-v4); Sec. 4 (v4)"
        paper_md: "not covered (its setup trains ensembles but reports no such result)"
      - q: "In the feature-training regime, the authors identify a time scale t1 before which the dynamics is still linear. How does t1 scale?"
        a: "t1 ~ √h · alpha"
        wrong: ["t1 ~ alpha / √h", "t1 ~ h · alpha^2", "t1 ~ 1 / (h · alpha)"]
        about: result
        source: "Abstract finding (4) (v1) and (iv) (v2-v4)"
        paper_md: "agrees: Sec. 4.2 (the characteristic time scale scales as alpha√h)"
      - q: "In the feature-training regime, by roughly what factor has the network's output grown at t ~ t1, when changes in the tangent kernel become significant?"
        a: "A factor of order √h"
        wrong: ["A factor of order h", "A factor of order alpha", "A factor of order log h"]
        about: result
        source: "Abstract finding (4) (v1); abstract (iv) and Sec. 5-6 (v4, ar5iv)"
        paper_md: "not covered"
      - q: "How did the eventual change of the tangent kernel, ||ΔΘ||, scale in the paper's experiments?"
        a: "As (√h·alpha)^(-a), with a < 2 and a approaching 2 as depth grows"
        wrong: ["As (√h·alpha)^(-a), with a > 2 and a approaching 4 as depth grows", "As (h·alpha)^(-1), whatever the depth", "As (√h·alpha)^(-1/2), whatever the depth"]
        about: result
        source: "Abstract finding (4) (v1); abstract and Sec. 1 (v4, ar5iv)"
        paper_md: "not covered"
      - q: "For the convolutional networks the paper studied, which regime gave the lower test error?"
        a: "Feature training"
        wrong: ["Lazy training", "Neither: both regimes gave the same error", "Lazy training at small width, feature training at large width"]
        about: result
        source: "Abstract finding (2) (v1: setup (B), convolutional, 'very significant'); abstract (ii), Sec. 1 and 7 (v4)"
        paper_md: "not covered (fully-connected networks only)"

