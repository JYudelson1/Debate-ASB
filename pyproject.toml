[project]
name = "debate-asb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Joey", email = "jyudel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "inspect-ai>=0.3.266",
    "openai>=3.18.0",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "remotezip>=0.12.6",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff==0.16.8",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["I"]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false
